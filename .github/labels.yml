- name: area/reports-api
  color: 5319e7
  description: Encrypted reports + share backend
- name: area/crawler-demo
  color: 5319e7
  description: pixi-crawler demo app
- name: area/metrics
  color: c2e0c6
  description: metrics-* packages (sampling, scoring, pipeline, etc.)
- name: area/impact-formula
  color: b60205
  description: Canonical RI/CI scoring math - single source of truth
- name: area/spinefolio
  color: fbca04
