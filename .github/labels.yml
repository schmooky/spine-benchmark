# --- Type labels (applied by humans or issue forms) ---
- name: bug
  color: d73a4a
  description: Something isn't working
- name: enhancement
  color: a2eeef
  description: New feature or request
- name: regression
  color: b60205
  description: Worked before, broken now
- name: performance
  color: fef2c0
  description: Perf-sensitive change or perf regression
- name: security
  color: ee0701
  description: Security issue or hardening
- name: question
  color: cc317c
  description: Further information is requested
- name: discussion
  color: d4c5f9
  description: Open-ended design or direction discussion

# --- Workflow / triage labels ---
- name: good first issue
  color: 7057ff
  description: Good for newcomers
- name: help wanted
  color: 008672
  description: Extra attention is needed
- name: needs-triage
  color: ededed
  description: Not yet reviewed by a maintainer
- name: needs-repro
  color: e99695
  description: Waiting for a reproducible test case
- name: blocked
  color: 000000
  description: Blocked on another issue, PR, or external input
- name: wontfix
  color: ffffff
  description: This will not be worked on
- name: duplicate
  color: cfd3d7
  description: This issue or PR already exists
- name: invalid
  color: e4e669
  description: "This doesn't seem right"

# --- Dependabot / automation ---
- name: dependencies
  color: 0366d6
