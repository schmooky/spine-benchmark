# Dependabot keeps npm + GitHub Actions dependencies fresh. For a workspace
# monorepo the npm ecosystem at the root covers every apps/* and packages/*
# subfolder - Dependabot walks the workspaces automatically.

version: 2
updates:
  # All workspace npm dependencies (apps/* and packages/*)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: chore(deps)
      include: scope
    # Collapse minor + patch bumps into a single PR per ecosystem so the
    # review queue stays short. Majors still come in as one PR each.
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # Pinned intentionally in the monorepo - bump these deliberately.
      - dependency-name: '@esotericsoftware/spine-pixi-v8'

  # GitHub Actions workflows under .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore(ci)
      include: scope
