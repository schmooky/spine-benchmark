name: Publish Package

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - pixi-crawler
          - spinefolio
          - metrics
          - metrics-factors
          - metrics-scoring
          - metrics-sampling
          - metrics-analyzers
          - metrics-pipeline
          - metrics-reporting
          - drawcall-tools
          - mesh-tools
          - render-tools
          - constraint-tools
          - file-tools
          - spine-loader
          - asset-store
          - workbench-core
      dry-run:
        description: 'Dry run (skip actual publish)'
        required: false
        type: boolean
        default: false

  push:
    branches:
      - main
    paths:
      - 'packages/*/package.json'

jobs:
  detect-changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version bumps
        id: detect
        run: |
          CHANGED=$(git diff HEAD~1 HEAD --name-only | grep 'packages/.*/package.json' || true)
          PACKAGES=()
          for FILE in $CHANGED; do
            PKG=$(echo "$FILE" | cut -d/ -f2)
            OLD=$(git show HEAD~1:"$FILE" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version" 2>/dev/null || echo "")
            NEW=$(node -p "require('./$FILE').version")
            if [ "$OLD" != "$NEW" ]; then
              echo "✅ $PKG: $OLD → $NEW"
              PACKAGES+=("$PKG")
            else
              echo "⏭️  $PKG: version unchanged ($NEW), skipping"
            fi
          done
          JSON=$(printf '%s\n' "${PACKAGES[@]}" | jq -R . | jq -sc .)
          echo "packages=$JSON" >> "$GITHUB_OUTPUT"

  auto-publish:
    needs: detect-changes
    if: |
      github.event_name == 'push' &&
      needs.detect-changes.outputs.packages != '[]' &&
      needs.detect-changes.outputs.packages != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Build
        run: npm run build --workspace @spine-benchmark/${{ matrix.package }}

      - name: Publish
        run: npm publish --workspace @spine-benchmark/${{ matrix.package }} --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Build
        run: npm run build --workspace @spine-benchmark/${{ inputs.package }}

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: npm publish --workspace @spine-benchmark/${{ inputs.package }} --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run
        if: ${{ inputs.dry-run }}
        run: |
          echo "📦 Dry run for @spine-benchmark/${{ inputs.package }}"
          npm pack --workspace @spine-benchmark/${{ inputs.package }} --dry-run
