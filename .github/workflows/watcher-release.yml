name: Watcher Release

# Builds standalone spine-watcher binaries for macOS and Windows and
# uploads them as GitHub Release assets.
#
# Trigger: push a tag matching `watcher-v*` (e.g. `watcher-v0.1.0`).
# After merging a version bump to main, tag the commit:
#   git tag watcher-v0.1.0 && git push origin watcher-v0.1.0
#
# The workflow:
#   1. Installs deps, builds the watcher TypeScript
#   2. Bundles into a single CJS file with esbuild
#   3. Compiles to standalone binaries with @yao-pkg/pkg
#   4. Creates a GitHub Release with the binaries attached

on:
  push:
    tags:
      - 'watcher-v*'

concurrency:
  group: watcher-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: node20-macos-arm64
            artifact: spine-watcher-macos-arm64
          - os: macos-13
            target: node20-macos-x64
            artifact: spine-watcher-macos-x64
          - os: windows-latest
            target: node20-win-x64
            artifact: spine-watcher-win-x64.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build watcher dependencies
        run: npm run build --workspace @spine-benchmark/metrics-impact-formula

      - name: Build watcher TypeScript
        run: npm run build --workspace @spine-benchmark/watcher

      - name: Bundle with esbuild
        run: npx esbuild apps/watcher/dist/main.js --bundle --platform=node --target=node20 --format=cjs --outfile=apps/watcher/dist/bundle.cjs

      - name: Compile binary
        run: npx @yao-pkg/pkg apps/watcher/dist/bundle.cjs --target ${{ matrix.target }} --output apps/watcher/dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/watcher/dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: binaries
          merge-multiple: true

      - name: List binaries
        run: ls -la binaries/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Spine Watcher ${{ github.ref_name }}
          body: |
            ## Spine Watcher

            Standalone .spine file watcher and performance analyzer.

            ### Download

            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `spine-watcher-macos-arm64` |
            | macOS (Intel) | `spine-watcher-macos-x64` |
            | Windows (x64) | `spine-watcher-win-x64.exe` |

            ### First run

            1. Download the binary for your platform
            2. Make it executable: `chmod +x spine-watcher-*` (macOS)
            3. Run it - it will ask you to locate your Spine installation
            4. Pick a `.spine` project file to watch
            5. Save changes in Spine Editor - metrics update automatically

            Requires Spine 4.2+ projects.
          files: binaries/*
          draft: false
          prerelease: false
