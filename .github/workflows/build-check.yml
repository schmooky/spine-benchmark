name: Build Check

# Builds every publishable workspace package in topological order using
# the same script the release workflow runs. Keeping the two paths
# identical means a green PR here is a strong signal that `npm run release`
# on main will also succeed.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build all publishable packages
        run: npm run build:all
