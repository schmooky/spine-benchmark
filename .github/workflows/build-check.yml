name: Build Check

# Builds every publishable workspace package in topological order using
# the same script the release workflow runs. Keeping the two paths
# identical means a green PR here is a strong signal that `npm run release`
# on main will also succeed.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build all publishable packages
        run: npm run build:all

      - name: Bundle size report
        # Informational on PRs - prints the gzipped size delta for the
        # marquee published packages. Until the committed baseline has
        # real numbers this is a "no baseline" report; once the baseline
        # is populated (npm run size:update on main), switch this step
        # to `npm run size:check` to enforce the 10% drift tolerance.
        run: npm run size
