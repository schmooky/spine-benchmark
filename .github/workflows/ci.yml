name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Least-privilege default. Individual jobs can override if they need more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run check:lint

      - name: Test
        run: npx vitest run
